[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "research-agent"
version = "0.1.0"
description = "Production-oriented AI Research Agent — Predixion AI Platform Engineering Intern Assignment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jayesh"}]

dependencies = [
    "openai>=1.40",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "trafilatura>=1.6",
    "duckduckgo-search>=6",
    "diskcache>=5.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
research-agent = "agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP042", "UP017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

